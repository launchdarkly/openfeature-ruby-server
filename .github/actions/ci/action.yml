name: CI Workflow
description: 'Shared CI workflow.'
inputs:
  ruby-version:
    description: 'The version of ruby to setup and run'
    required: true

runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler: 4.0.19

    - name: Install dependencies
      shell: bash
      run: bundle install

    - name: Run tests
      shell: bash
      run: bundle exec rspec spec

    - name: Run RuboCop
      shell: bash
      run: bundle exec rubocop
